<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Musical Chairs</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/addons/p5.sound.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="left">
      <div class="game-container"></div>
    </div>
    <div class="right">
      <h2>You're searching for a place to sit…</h2>
      <p>This is Musical Chairs with passengers!</p>
      <p>Click chairs or press keys 1–7 to play notes.</p>
      <p>Press ENTER to record/playback your sequence.</p>
      <p>Double-click the canvas to stop rotation.</p>
    </div>
  </div>
  <script src="sketch.js"></script>
</body>
</html>
